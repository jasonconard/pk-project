<div class="backdrop" (click)="closed.emit()"></div>
<section
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="battle-sim-title"
>
  <header>
    <h2 id="battle-sim-title">Simuler un combat</h2>
    <button
      type="button"
      class="close"
      aria-label="Fermer"
      title="Fermer (Échap)"
      (click)="closed.emit()"
    >
      <svg lucideX></svg>
    </button>
  </header>
  <div class="body">
    <label class="field">
      <span>Ennemis</span>
      <select [value]="group()" (change)="group.set($any($event.target).value)">
        @for (g of groups; track g.id) {
          <option [value]="g.id" [selected]="g.id === group()">
            {{ g.name }}
          </option>
        }
      </select>
      @if (groupMembers()) {
        <small>{{ groupMembers() }}</small>
      } @else if (!groups.length) {
        <small
          >Aucun groupe : créez-en dans Éditeurs → Base de données →
          Groupes.</small
        >
      }
    </label>
    <label class="field">
      <span>Lieu</span>
      <select [value]="place()" (change)="place.set($any($event.target).value)">
        <option value="" [selected]="place() === ''">
          Ici, où est le joueur
        </option>
        @for (m of maps; track m.id) {
          <option [value]="m.id" [selected]="m.id === place()">
            {{ m.name }}
          </option>
        }
      </select>
      @if (place()) {
        <small>Au point d'arrivée de la carte, puis retour ici</small>
      }
    </label>
    <label class="field">
      <span>Arène</span>
      <select [value]="arena()" (change)="arena.set($any($event.target).value)">
        <option value="" [selected]="arena() === ''">
          Celle du groupe ou du lieu
        </option>
        <option [value]="arenaHere" [selected]="arena() === arenaHere">
          Sur place, sans arène
        </option>
        @for (a of arenas; track a.id) {
          <option [value]="a.id" [selected]="a.id === arena()">
            {{ a.name }}
          </option>
        }
      </select>
    </label>
    <battle-team-setup [(team)]="team" />
  </div>
  <footer>
    <small
      >Rien n'est gardé : l'équipe, ses objets et l'argent reviennent comme
      avant.</small
    >
    <button
      type="button"
      class="launch"
      [disabled]="!canLaunch()"
      (click)="launch()"
    >
      <svg lucideSwords></svg>
      Lancer
    </button>
  </footer>
</section>
