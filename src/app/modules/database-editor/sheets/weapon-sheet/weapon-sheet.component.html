@let wp = weapon();
<div class="block">
  <h3>Description</h3>
  <input
    type="text"
    maxlength="120"
    placeholder="Facultatif"
    aria-label="Description"
    [value]="wp.note ?? ''"
    (input)="setNote(wp, $any($event.target).value)"
  />
</div>
<label class="switch">
  <input
    type="checkbox"
    [checked]="!!wp.ranged"
    (change)="setRanged(wp, $any($event.target).checked)"
  />
  Attaque à distance
</label>
<p class="note">
  Avec une arme à distance (un arc…), le personnage tire de là où il est en
  combat, sans aller jusqu'à sa cible.
</p>
<p class="hint">
  <svg lucideInfo></svg> Frapper avec ce type d'arme fait monter son niveau, qui
  apprend des compétences.
</p>
