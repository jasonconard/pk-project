<select
  aria-label="Élément ou arme"
  (change)="picked.emit($any($event.target).value)"
>
  @if (!isLearnChoice(value())) {
    <option [value]="value()" selected>(supprimé)</option>
  }
  <optgroup label="Éléments">
    @for (c of learnChoices(); track c.id) {
      @if (!c.weapon) {
        <option [value]="c.id" [selected]="c.id === value()">
          {{ c.name }}
        </option>
      }
    }
  </optgroup>
  <optgroup label="Armes">
    @for (c of learnChoices(); track c.id) {
      @if (c.weapon) {
        <option [value]="c.id" [selected]="c.id === value()">
          {{ c.name }}
        </option>
      }
    }
  </optgroup>
</select>
