<div class="choices" role="listbox" aria-label="Choix du modèle">
  @for (choice of filteredChoices(); track choice.model.id; let i = $index) {
    <div class="choice" role="option"
         animate.enter="model-choice-enter" animate.leave="model-choice-leave"
         [style.--offset.px]="i % 3 ? -10 : 10"
         [attr.aria-selected]="choice.model.id === currentModel()"
         (mousedown)="selectModel(choice)"
         [class.selected]="choice.model.id === currentModel()">
      <div class="pic">
        @if (croppedPics()[choice.model.id]; as pic) {
          <img animate.enter="anim-fade-in" [src]="pic" alt="">
        }
      </div>
      <div class="title">{{ choice.model.id }}</div>
    </div>
  }
</div>
