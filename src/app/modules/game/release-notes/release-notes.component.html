<div class="backdrop" (click)="closed.emit()"></div>
<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="release-notes-title">
  <header>
    <h2 id="release-notes-title">Nouveautés</h2>
    <button type="button" class="close" aria-label="Fermer" title="Fermer (Échap)" (click)="closed.emit()">✕</button>
  </header>
  <div class="list">
    @for (release of releases; track release.version) {
      <article [class.current]="release.version === current()">
        <h3>
          v{{ release.version }}
          <span class="date">· {{ release.dateLabel }}</span>
          @if (release.version === current()) {
            <span class="badge">ta version</span>
          }
        </h3>
        <ul>
          @for (note of release.notes; track $index) {
            <li>{{ note }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
