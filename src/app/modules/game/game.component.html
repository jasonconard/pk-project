<div class="canvas-container" #canvas></div>

@if (hud(); as hud) {
  @if (hud.framePerSec) {
    <div class="fps-count" (click)="toggleGameMode()">
      {{ hud.framePerSec }} fps
    </div>
  }
}

@if (hud(); as hud) {
  <game-temperature-gauge [temperature]="hud.temperature" />
  @if (hud.mode === GameMode.MAP) {
    <game-editor-bar [editMode]="hud.editMode" [modelId]="hud.editModelId" [tileId]="hud.editTileId" [brush]="hud.editBrush" [selection]="hud.editSelection"
                     [canUndo]="hud.editCanUndo" [canRedo]="hud.editCanRedo"
                     (toggled)="toggleEditMode()" (modelSelected)="selectEditModel($event)" (tileSelected)="selectEditTile($event)" (brushChange)="setEditBrush($event)" (command)="editCommand($event)" />
  }
}

<game-weather-panel [weather]="weather()" [night]="night()" [hour]="hour()" [timeFlow]="timeFlow()"
                    [windStrength]="windStrength()" [windDirection]="windDirection()"
                    [fireflyColor]="fireflyColor()" [leafMode]="leafMode()" [gusts]="gusts()" [cloudDensity]="cloudDensity()"
                    [soundVolume]="soundVolume()" [soundMuted]="soundMuted()"
                    (weatherSelected)="setWeather($event)" (hourChange)="setHour($event)" (timeFlowChange)="setTimeFlow($event)"
                    (windChange)="setWind($event)" (fireflyColorChange)="setFireflyColor($event)"
                    (leafModeChange)="setLeafMode($event)" (gustsChange)="setGusts($event)"
                    (cloudDensityChange)="setCloudDensity($event)" (soundChange)="setSound($event)" />

<core-stick />
<core-touch-pad />

@if (hud()?.loading) {
  <div class="loading-screen" animate.enter="anim-fade-in" animate.leave="anim-loading-out">
    Chargement ...
  </div>
}
@if (hud()?.paused) {
  <div class="pause-screen" animate.enter="anim-fade-in" animate.leave="anim-fade-out" (touchend)="togglePaused()">
    Pause
  </div>
}

<core-message />
@if (hud()?.mapHelper; as mapHelper) {
  <core-teleport [mapHelper]="mapHelper" />
}


@if (hud()?.mode === GameMode.FIGHT) {
  <fight-ui />
}
