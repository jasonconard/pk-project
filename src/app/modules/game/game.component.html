<div class="canvas-container" #canvas></div>

@if (hud(); as hud) {
  @if (hud.framePerSec) {
    <div class="fps-count" (click)="toggleGameMode()">
      {{ hud.framePerSec }} fps
    </div>
  }
}

<core-stick />
<core-touch-pad />

@if (hud()?.loading) {
  <div class="loading-screen" animate.enter="anim-fade-in" animate.leave="anim-loading-out">
    Chargement ...
  </div>
}
@if (hud()?.paused) {
  <div class="pause-screen" animate.enter="anim-fade-in" animate.leave="anim-fade-out" (touchend)="togglePaused()">
    Pause
  </div>
}

<core-message />
@if (hud()?.mapHelper; as mapHelper) {
  <core-teleport [mapHelper]="mapHelper" />
}

@if (hud(); as hud) {
  @if (hud.drawModelOpen) {
    <mapping-model-choice animate.enter="anim-fade-in" animate.leave="anim-fade-out"
      [selectedModel]="hud.drawModelId"
      (modelSelected)="updateModelChoice($event)" />
  }
}

@if (hud()?.mode === GameMode.FIGHT) {
  <fight-ui />
}
