<div class="app-container">
  <router-outlet />

  <button type="button" class="btn-fullscreen" (click)="toggleFullscreen()"
          [attr.aria-label]="fullScreened() ? 'Quitter le plein écran' : 'Plein écran'">
    @if (fullScreened()) {
      <img src="assets/img/ui/icon-fullscreen-exit.svg" alt="">
    } @else {
      <img src="assets/img/ui/icon-fullscreen.svg" alt="">
    }
  </button>

  @if (logs() && debugMode()) {
    <div class="logs">{{ logs() }}</div>
  }
</div>
