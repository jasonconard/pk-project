@if (isTouchDevice() && gameControls() && !hasMessage()) {
  <div class="right-touch-btns" animate.enter="anim-fade-in-delayed" animate.leave="anim-fade-out">
    @for (btn of btns; track btn.label) {
      <div class="btn-container"
           [style]="getBtnStyle(btn, true)"
           (touchend)="touchBtn(btn, 'up')"
           (touchstart)="touchBtn(btn, 'down')">
        <div class="btn" [style]="getBtnStyle(btn, false)">
          {{ btn.label.toUpperCase() }}
        </div>
      </div>
    }
  </div>
}
