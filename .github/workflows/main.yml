name: Deploy to GitHub Pages

# Builds the game (PWA) and publishes it on the gh-pages branch at each push on main
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run gh-build

      # Hash routing doesn't need it, but unknown URLs land on the game instead of a GitHub 404;
      # .nojekyll: files served as they are
      - name: Prepare the site
        run: |
          cp dist/gh-pages/browser/index.html dist/gh-pages/browser/404.html
          touch dist/gh-pages/browser/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/gh-pages/browser
          clean: true
