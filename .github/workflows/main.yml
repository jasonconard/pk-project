name: Release

# At each release, a tag v<version> pushed (e.g. v0.0.2, same version as package.json):
# - the game (PWA) is built and published on the gh-pages branch;
# - the Android app (APK) is built, signed and attached to a GitHub release of the tag.
# Can also be started by hand (Actions tab): the APK is then only kept as a build artifact.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # A release tag must match the version shown in the game (package.json)
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run gh-build

      # Hash routing doesn't need it, but unknown URLs land on the game instead of a GitHub 404;
      # .nojekyll: files served as they are
      - name: Prepare the site
        run: |
          cp dist/gh-pages/browser/index.html dist/gh-pages/browser/404.html
          touch dist/gh-pages/browser/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/gh-pages/browser
          clean: true

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($VERSION)"
            exit 1
          fi

      - name: Use Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      # Game files (without the PWA service worker) copied into the Android project
      - name: Build the game
        run: npm run android-build

      # Always the same key: Android installs an update over the previous version only if signed with it
      - name: Signing key
        env:
          PK_KEYSTORE_BASE64: ${{ secrets.PK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PK_KEYSTORE_BASE64" ]; then
            echo "Missing secret PK_KEYSTORE_BASE64 (see README, Android app)"
            exit 1
          fi
          echo "$PK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the APK
        working-directory: android
        env:
          PK_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          PK_KEYSTORE_PASSWORD: ${{ secrets.PK_KEYSTORE_PASSWORD }}
          PK_KEY_ALIAS: ${{ secrets.PK_KEY_ALIAS }}
          PK_KEY_PASSWORD: ${{ secrets.PK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/pk-project-${GITHUB_REF_NAME}.apk"

      - name: Keep the APK (build artifact)
        uses: actions/upload-artifact@v7
        with:
          name: pk-project-apk
          path: ${{ runner.temp }}/pk-project-*.apk

      # The release of the tag, with the APK: the app checks it to offer updates
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/pk-project-*.apk
          generate_release_notes: true
