name: Deploy to GitHub Pages

# Builds the game (PWA) and publishes it on the gh-pages branch at each release: a tag v<version> pushed
# (e.g. v0.0.2, same version as package.json). Can also be started by hand (Actions tab).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A release tag must match the version shown in the game (package.json)
      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run gh-build

      # Hash routing doesn't need it, but unknown URLs land on the game instead of a GitHub 404;
      # .nojekyll: files served as they are
      - name: Prepare the site
        run: |
          cp dist/gh-pages/browser/index.html dist/gh-pages/browser/404.html
          touch dist/gh-pages/browser/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/gh-pages/browser
          clean: true
